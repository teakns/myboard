<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('myboard-theme'); } catch (e) {}
  if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --ink:#172033; --ink2:#55607A; --ink3:#8A93A8; --line:#D9DFEB;
  --accent:#3347E8; --accent-soft:rgba(51,71,232,.10); --danger:#D6334A; --star:#E0A100; --heart:#E5395A;
  --side:#131A2B; --side-ink:#E8ECF7; --side-dim:#8D97B2;
  --col:rgba(255,255,255,.62); --dot:#C9D0E1;
  --shadow-card:0 1px 2px rgba(23,32,51,.10),0 8px 16px -10px rgba(23,32,51,.38);
  --shadow-lift:0 22px 40px -14px rgba(23,32,51,.5);
  --white:#FFFFFF; --yellow:#FFF0A3; --mint:#C9F1DD; --sky:#CDE5FF; --peach:#FFD9C6; --lilac:#E2D9FF; --pink:#FFD4E3;
  --card-ink:#1A2236; --card-ink2:#4B5572;
  font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0D1220; --surface:#161D2F; --ink:#E8ECF7; --ink2:#A2ACC6; --ink3:#6C7792; --line:#252E47;
  --accent:#7A89FF; --accent-soft:rgba(122,137,255,.16); --danger:#FF6B80; --star:#F2B544; --heart:#FF6B8A;
  --side:#090D18; --col:rgba(255,255,255,.035); --dot:#1C2440;
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 8px 16px -10px rgba(0,0,0,.7);
  --white:#1F2840; --yellow:#4C4521; --mint:#1D4335; --sky:#1F3B5F; --peach:#583B2E; --lilac:#3F3669; --pink:#592F47;
  --card-ink:#EEF1FA; --card-ink2:#B8C1D9;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.spacer{flex:1}
.muted{opacity:.55}

/* ───── 전체 틀 ───── */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px 12px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.02em;padding:2px 10px 18px}
.side-title{font-size:12px;color:var(--side-dim);padding:0 10px 6px;font-weight:600}
.boards{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.board-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:9px 10px;border-radius:9px}
.board-item:hover{background:rgba(255,255,255,.06)}
.board-item.on{background:rgba(255,255,255,.13);font-weight:600}
.board-item .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-item .bc{font-size:12px;color:var(--side-dim)}
.side-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-ink);text-align:left;padding:9px 10px;border-radius:9px}
.side-btn:hover{background:rgba(255,255,255,.07)}
.side-btn.add{margin-top:6px;border:1px dashed rgba(255,255,255,.22)}
.side-foot{border-top:1px solid rgba(255,255,255,.1);margin-top:10px;padding-top:8px;display:flex;flex-direction:column;gap:2px}
.side-btn.dim{color:var(--side-dim)}
.sync{display:flex;align-items:center;gap:8px;padding:8px 10px 2px;font-size:12px;color:var(--side-dim)}
.sync i{width:8px;height:8px;border-radius:50%;background:#46C98B;flex:none}
.sync.saving i{background:#F2B544}
.sync.error i{background:#FF6B80}
.acct{display:flex;align-items:center;gap:8px;padding:2px 10px 0;font-size:12px;color:var(--side-dim)}
.acct:empty{display:none}
.acct span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct button{border:0;background:transparent;color:var(--side-ink);text-decoration:underline;font-size:12px;padding:0}
.ver{padding:2px 10px 0 26px;font-size:11.5px;color:var(--side-dim);opacity:.8}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:16px 24px 10px;min-height:66px;flex-wrap:wrap}
.board-title{flex:1 1 0;max-width:320px;min-width:130px;font-size:22px;font-weight:700;letter-spacing:-.02em;background:transparent;border:0;border-radius:8px;padding:3px 8px;margin-left:-8px;color:var(--ink)}
.board-title:hover{background:var(--accent-soft)}
.board-title:focus{background:var(--surface);outline:2px solid var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 10px 0 12px;height:38px;width:160px;color:var(--ink3)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink)}
.search kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:999px;padding:0 16px;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.layout-btn{border-radius:11px;padding:0 12px 0 14px;gap:8px}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--ink2)}
.icon-btn:hover{background:var(--accent-soft);color:var(--ink)}
.icon-btn.sm{width:28px;height:28px;border-radius:8px}
.menu-btn{display:none}

.tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 24px 8px}
.tags:empty{display:none}
.tagchip{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:2px 11px;font-size:13px}
.tagchip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.stage{flex:1;min-height:0;position:relative}
.scroller{position:absolute;inset:0;overflow:auto;padding:8px 24px 48px}
.empty-note{text-align:center;color:var(--ink3);padding:40px 0}

/* ───── 열(셸프) ───── */
.shelf{position:absolute;inset:0;display:flex;gap:14px;padding:8px 24px 24px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 292px;max-height:100%;display:flex;flex-direction:column;background:var(--col);border:1px solid var(--line);border-radius:16px}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 8px 6px 16px}
.col-name{margin:0;flex:1;min-width:0;font-size:14px;font-weight:700;cursor:text;border-radius:6px;padding:2px 4px;margin-left:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-name:hover{background:var(--accent-soft)}
.count{font-size:12px;font-weight:600;color:var(--ink3)}
.col-list>.card{flex:none}
.col-list{overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:10px;min-height:30px}
.col-f{padding:6px 10px 10px}
.add-card{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--ink2);padding:8px 8px;border-radius:10px;text-align:left}
.add-card:hover{background:var(--accent-soft);color:var(--ink)}
.add-col{flex:0 0 200px;display:flex;align-items:center;gap:8px;justify-content:center;height:46px;border:1.5px dashed var(--ink3);border-radius:16px;background:transparent;color:var(--ink2)}
.add-col:hover{border-color:var(--accent);color:var(--accent)}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.composer textarea{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;color:var(--ink);min-height:44px;max-height:180px}
.composer .row{display:flex;align-items:center;gap:6px;margin-top:6px}
.c-img{position:relative;margin-top:6px}
.c-img img{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:8px}
.c-img button{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.c-note{margin-top:6px;font-size:13px;color:var(--ink2)}
.composer.drop{outline:2px dashed var(--accent);outline-offset:2px}
.inline-input{width:100%;font-weight:700;border:0;border-radius:6px;padding:2px 4px;background:var(--surface);outline:2px solid var(--accent);color:var(--ink)}

/* ───── 담벼락·그리드·스트림 ───── */
.flow-compose{margin:0 0 16px}
.compose-bar{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;height:46px;border:1.5px dashed var(--ink3);border-radius:14px;background:transparent;color:var(--ink2);padding:0 16px;text-align:left}
.compose-bar:hover{border-color:var(--accent);color:var(--accent)}
.flow-compose .composer{max-width:560px}
.scroller[data-l=stream] .flow-compose{max-width:620px;margin:0 auto 16px}
.scroller[data-l=stream] .compose-bar{max-width:none}
.scroller[data-l=stream] .flow-compose .composer{max-width:none}
.lay-masonry{column-width:250px;column-gap:14px}
.lay-masonry>.card,.lay-masonry>.ph{break-inside:avoid;margin-bottom:14px}
.lay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:260px;gap:14px}
.lay-grid>.card{display:flex;flex-direction:column;height:100%}
.lay-grid .card-img{flex:1 1 0;min-height:70px;overflow:hidden}
.lay-grid .card-img img{width:100%;height:100%;max-height:none;object-fit:cover}
.lay-grid .card-main{flex:0 1 auto;overflow:hidden;max-height:100%}
.lay-grid .card.noimg .card-main{flex:1 1 auto}
.lay-grid .card-body{-webkit-line-clamp:4}
.lay-grid .card-meta{flex:none}
.lay-stream{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.lay-stream .card-title{font-size:16px}
.lay-stream .card-body{display:block;-webkit-line-clamp:unset;font-size:14px}
.lay-stream .card-img img{max-height:440px}
.vid{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#2B3452,#151B2E);cursor:pointer;overflow:hidden}
.vid img,.card-img.vid img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover}
.vplay{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;padding-left:3px;transition:transform .15s,background .15s}
.vid:hover .vplay{transform:scale(1.08);background:var(--accent)}
.vsrc{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.55);padding:1px 8px;border-radius:999px}
.vid.playing{cursor:default;background:#000}
.vid.playing iframe,.vid.playing video,.pl-box iframe,.pl-box video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.lay-grid .vid{aspect-ratio:auto}
.lay-grid .card-img.vid{flex:1 1 0}
.modal-back.player{background:rgba(5,8,16,.84)}
.pl{width:min(960px,100%);display:flex;flex-direction:column;gap:10px;animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
.pl-box{position:relative;aspect-ratio:16/9;width:min(100%,calc((100dvh - 120px) * 16 / 9));margin:0 auto;background:#000;border-radius:14px;overflow:hidden}
.pl-bar{display:flex;align-items:center;gap:8px;color:#fff}
.pl-bar .icon-btn{color:#fff}
.pl-bar .icon-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.pl-h{font-size:12.5px;opacity:.75;white-space:nowrap}
@media (max-width:760px){.pl-h{display:none}}
.pl-t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-time{font-size:12px;color:var(--card-ink2);margin-bottom:2px}
.card-cm{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;border-top:1px solid color-mix(in srgb,var(--card-ink) 12%,transparent);cursor:default}
.cm-i{display:flex;gap:8px;align-items:baseline;font-size:13px}
.cm-i span{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.cm-i time{font-size:11px;color:var(--card-ink2)}
.cm-i button{border:0;background:none;color:var(--card-ink2);padding:0;opacity:.5;align-self:center}
.cm-i button:hover{opacity:1}
.cm-in input{width:100%;height:32px;border-radius:999px;border:1px solid color-mix(in srgb,var(--card-ink) 22%,transparent);background:color-mix(in srgb,var(--cb) 70%,transparent);padding:0 12px;outline:none;color:var(--card-ink);user-select:text;-webkit-user-select:text}
.cm-in input:focus{border-color:var(--card-ink)}

/* ───── 카드 ───── */
.c-white{--cb:var(--white)} .c-yellow{--cb:var(--yellow)} .c-mint{--cb:var(--mint)} .c-sky{--cb:var(--sky)}
.c-peach{--cb:var(--peach)} .c-lilac{--cb:var(--lilac)} .c-pink{--cb:var(--pink)}
.card{position:relative;border-radius:12px;background:var(--cb);color:var(--card-ink);box-shadow:var(--shadow-card);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow-card),0 0 0 2px var(--accent-soft)}
.card-img img{display:block;width:100%;max-height:180px;object-fit:cover;background:rgba(0,0,0,.05)}
.card-main{display:flex;gap:10px;padding:12px 14px}
.card-text{min-width:0;flex:1}
.card-title{margin:0;font-size:14.5px;font-weight:650;line-height:1.4;word-break:break-word;white-space:pre-wrap}
.card-body{margin:4px 0 0;font-size:13px;color:var(--card-ink2);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 12px}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;font-size:11.5px;line-height:1.6;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--card-ink) 10%,transparent);color:var(--card-ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.chip:hover{background:color-mix(in srgb,var(--card-ink) 18%,transparent)}
.chip.rx{padding:1px 6px;font-size:12.5px}
.chip.star{color:var(--card-ink)}
.chip.star svg{color:var(--star);fill:var(--star)}
.chip.colchip{background:var(--card-ink);color:var(--cb)}
.check{flex:none;display:grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.7px solid var(--card-ink2);background:transparent;color:var(--cb);padding:0}
.check:hover{border-color:var(--card-ink)}
.check[aria-pressed=true]{background:var(--card-ink);border-color:var(--card-ink)}
.check.lg{width:24px;height:24px}
.like-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;display:grid;place-items:center;padding:0;background:color-mix(in srgb,var(--cb) 82%,transparent);color:var(--card-ink);opacity:0;transition:opacity .15s}
.card:hover .like-btn,.like-btn:focus-visible,.like-btn.on{opacity:1}
.like-btn.on{color:var(--heart)}
.like-btn.on svg{fill:var(--heart)}
@media (hover:none){.like-btn{opacity:.75}}
.card.done{opacity:.7}
.card.done .card-title{text-decoration:line-through;opacity:.6}
.card.dim{opacity:.2;filter:saturate(.5)}
.card.src{position:absolute;visibility:hidden;pointer-events:none}
.ph{flex:none;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:12px}
.drag-clone{position:fixed;z-index:999;pointer-events:none;transform:rotate(2.2deg) scale(1.02);box-shadow:var(--shadow-lift);cursor:grabbing;opacity:.97;margin:0!important}
body.dragging,body.dragging *{cursor:grabbing!important}

/* ───── 캔버스 ───── */
.wall{position:absolute;inset:0;overflow:auto;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:26px 26px;background-attachment:local}
.wall-inner{position:relative}
.wcard{position:absolute;width:236px}
.wcard.lifting{z-index:60;box-shadow:var(--shadow-lift);transform:rotate(1.6deg);cursor:grabbing}
.wall.tidying .wcard{transition:left .38s cubic-bezier(.2,.8,.2,1),top .38s cubic-bezier(.2,.8,.2,1)}
.wall-hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:var(--ink3);pointer-events:none}
.wall-hint b{display:block;font-size:16px;color:var(--ink2);margin-bottom:4px}

/* ───── 타임라인 ───── */
.tl{position:relative;max-width:980px;margin:0 auto;padding-bottom:24px}
.tl-axis{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-1px)}
.tl-date{display:flex;justify-content:center;align-items:center;gap:6px;margin:22px 0 12px;position:relative;z-index:1}
.tl-date span{background:var(--ink);color:var(--bg);padding:4px 14px;border-radius:999px;font-weight:600;font-size:13px}
.tl-date.now span{background:var(--accent);color:#fff}
.tl-date button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink2);display:grid;place-items:center;padding:0}
.tl-date button:hover{border-color:var(--accent);color:var(--accent)}
.tl-item{position:relative;width:calc(50% - 32px);margin:0 0 14px}
.tl-item.l{margin-right:auto}
.tl-item.r{margin-left:auto}
.tl-item::after{content:'';position:absolute;top:16px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-sizing:content-box}
.tl-item.l::after{right:-40px}
.tl-item.r::after{left:-40px}
.tl-hint{position:relative;z-index:1;text-align:center;color:var(--ink3);margin-top:8px}

/* ───── 지도 ───── */
.mapwrap{position:absolute;inset:0;display:flex}
.map-side{flex:0 0 280px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--col);min-height:0}
.mapwrap.no-list .map-side{display:none}
.map-side-h{padding:14px 16px 6px;font-weight:700}
.map-side-h small{font-weight:400;color:var(--ink3);margin-left:6px}
.map-list{overflow:auto;flex:1;padding:4px 8px 12px}
.map-item{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;color:var(--ink)}
.map-item:hover{background:var(--accent-soft)}
.map-item .dot{flex:none;width:12px;height:12px;margin-top:5px;border-radius:50%;background:var(--cb);border:2.5px solid var(--card-ink)}
.map-item.nopos .dot{border-style:dashed;opacity:.6}
.map-item b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-item small{display:block;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-col{flex:1;min-width:0;position:relative}
.map{position:absolute;inset:0;isolation:isolate;z-index:0;background:var(--bg)}
.map-search{position:absolute;z-index:3;top:12px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none}
.map-search>*{pointer-events:auto}
.map-search .icon-btn{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card)}
.ms-box{display:flex;align-items:center;gap:8px;flex:0 1 340px;min-width:0;height:36px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px;color:var(--ink3);box-shadow:var(--shadow-card)}
.ms-box input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink)}

.pinwrap{background:none;border:0}

/* ───── 시작 화면·보드 만들기 ───── */
.welcome{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}

.tpls{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:26px;max-width:760px}
.tpl{width:168px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;text-align:left}
.tpl:hover,.tpl.on{border-color:var(--accent)}
.tpl.on{box-shadow:0 0 0 3px var(--accent-soft)}
.tpl svg{display:block;width:100%;height:auto;margin-bottom:8px}
.tpl b{display:block;font-size:14px}
.tpl span{font-size:12.5px;color:var(--ink2)}
.skel{position:absolute;inset:0;display:flex;gap:14px;padding:16px 24px}
.skel div{flex:0 0 292px;height:240px;border-radius:16px;background:var(--col);border:1px solid var(--line);animation:pulse 1.2s ease-in-out infinite}

@keyframes pulse{50%{opacity:.5}}

/* ───── 카드 편집 창 ───── */
.modal-back{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;padding:16px;background:rgba(10,14,26,.5);backdrop-filter:blur(2px);animation:fade .15s}
.modal{width:min(580px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;border-radius:18px;background:var(--cb);color:var(--card-ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}

.m-head{display:flex;align-items:center;gap:12px;padding:18px 14px 4px 20px}

.m-row{display:flex;align-items:center;gap:10px;padding:9px 20px;border-top:1px solid color-mix(in srgb,var(--card-ink) 12%,transparent);color:var(--card-ink2)}

[data-theme=dark] .m-row input[type=date]{color-scheme:dark}
.pinned{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--card-ink2);white-space:nowrap}
.place-res{padding:0 12px 6px}
.place-res:empty{display:none}

.place-res button:hover{background:color-mix(in srgb,var(--card-ink) 10%,transparent)}
.pr-msg{padding:6px 10px;font-size:13px;color:var(--card-ink2)}
.sw{gap:8px}
.sw button{width:26px;height:26px;border-radius:50%;border:1px solid color-mix(in srgb,var(--card-ink) 25%,transparent);background:var(--sc);padding:0}

.react{flex-wrap:wrap;gap:6px}
.rxb{width:34px;height:34px;border-radius:50%;border:1px solid color-mix(in srgb,var(--card-ink) 18%,transparent);background:transparent;font-size:16px;padding:0;line-height:1}

.stars{display:flex;gap:2px}
.star{border:0;background:none;padding:2px;color:var(--card-ink2);opacity:.7}
.star.on{color:var(--star);opacity:1}
.star.on svg{fill:var(--star)}
.m-cm{padding:10px 20px 14px;border-top:1px solid color-mix(in srgb,var(--card-ink) 12%,transparent);display:flex;flex-direction:column;gap:8px}
.m-cm h5{margin:0;font-size:12.5px;color:var(--card-ink2);font-weight:600}
.cm-list{display:flex;flex-direction:column;gap:8px}
.cm{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--card-ink) 7%,transparent);border-radius:12px;padding:8px 10px}
.cm p{margin:0;flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.cm time{display:block;font-size:11px;color:var(--card-ink2)}
.cm button{border:0;background:none;color:var(--card-ink2);padding:2px;opacity:.6}
.cm button:hover{opacity:1}
.cm-add{display:flex;gap:6px}
.cm-add input{flex:1;min-width:0;height:36px;border-radius:999px;border:1px solid color-mix(in srgb,var(--card-ink) 22%,transparent);background:transparent;padding:0 14px;outline:none;color:var(--card-ink)}

.m-foot{display:flex;align-items:center;gap:8px;padding:12px 16px 16px 20px;border-top:1px solid color-mix(in srgb,var(--card-ink) 12%,transparent)}
.m-foot .btn.ghost{color:var(--card-ink2)}

.btn.solid{background:var(--card-ink);border-color:var(--card-ink);color:var(--cb)}
.sel{height:36px;border-radius:10px;border:1px solid color-mix(in srgb,var(--card-ink) 22%,transparent);background:transparent;padding:0 8px;max-width:150px;color:var(--card-ink)}

.dialog{width:min(440px,100%);background:var(--surface);color:var(--ink);border-radius:18px;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
.dialog.wide{width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto}
.dialog h3{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}

.dialog .d-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.dialog .tpl span{display:none}

.menu{position:fixed;z-index:1200;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 18px 40px -12px rgba(0,0,0,.4);animation:fade .1s}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink)}
.mi:hover:not(:disabled){background:var(--accent-soft)}
.mi:disabled{opacity:.4;cursor:default}
.mi.danger{color:var(--danger)}
.mi-t{flex:1;min-width:0}
.mi-t b{display:block;font-weight:500}
.mi-t small{display:block;font-size:12px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:1300;display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:rise .2s;max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;font-weight:700;text-decoration:underline;padding:0;color:inherit}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}

.scrim{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:272px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  .app.side-open .side{transform:none}
  .app.side-open .scrim{display:block;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45)}
  .menu-btn{display:grid}
  .top{padding:12px 14px 6px;gap:8px}
  .board-title{flex:1 1 140px;font-size:19px}
  .search{order:10;width:100%}
  .btn.primary span{display:none}
  .btn.primary{padding:0;width:38px}
  .tags{padding:0 14px 8px}
  .scroller{padding:8px 14px 40px}
  .shelf{padding:8px 14px 20px}
  .col{flex-basis:84vw}
  .map-side{position:absolute;z-index:5;inset:0 auto 0 0;width:84%;background:var(--surface);box-shadow:0 0 40px rgba(0,0,0,.35)}
  .tl-axis{left:18px}

  .tl-item{width:auto;margin:0 0 14px 44px!important}
  .tl-item::after{left:-33px!important;right:auto!important}
  .lay-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:230px}
}

  S.boards = (res.boards || []).map(normBoard).sort(function (a, z) { return a.order - z.order || a.createdAt - z.createdAt; });

  S.comments = (res.comments || []).map(normComment);
  S.votes = (res.votes || []).map(normVote); reindexVotes();
  if (SHARE) S.share = { role: res.role || 'view', approval: !!res.approval, label: res.label || '' };
  else { if (res.shares) S.shares = res.shares.map(normShare); S.baseUrl = res.baseUrl || S.baseUrl || ''; }
  S.ver = String(res.ver || '');
  S.cards.forEach(function (c) {
    var b = S.boards.filter(function (x) { return x.id === c.boardId; })[0];
    if (b && !b.columns.some(function (col) { return col.id === c.colId; })) c.colId = b.columns[0].id;
  });
  if (!SHARE) S.cards.forEach(function (c) {                 // 제목·내용에 들어 있던 영상 주소는 링크 칸으로 옮겨 줌
    if (c.link) return;
    var a = splitVideoLink(c.body), t = splitVideoLink(c.title);
    if (a.link) { c.link = a.link; c.body = a.text; qCard(c); }
    else if (t.link) { c.link = t.link; c.title = t.text; qCard(c); }
  });
  var keep = S.active, saved = SHARE ? null : LS.get('myboard-active');
  S.active = S.boards.some(function (b) { return b.id === keep; }) ? keep : (S.boards.some(function (b) { return b.id === saved; }) ? saved : (S.boards[0] ? S.boards[0].id : null));
}
/* ═════════ 파이어베이스 실시간 흐름 ═════════ */
var stash = {}, liveDirty = false;
function liveBusy() { return typingNow() || !!drag || layers.length > 0; }
function liveGuard() { if (liveBusy()) { liveDirty = true; return; } flushLive(); }
function fbStart() {
  S.loading = true; renderStage();
  api.init(function (user) {
    if (!user) {
      api.stop(); S.user = null; S.cards = []; S.comments = []; S.boards = []; S.active = null; S.boardLoading = false; stash = {}; updateAccount(); showGate('SIGNIN'); return;
    }
    S.user = user; updateAccount(); S.gate = ''; $('#app').classList.remove('is-gate'); S.loading = true; renderStage();
    api.watchBoards(function (rows) { stash.boards = rows; if (S.loading) flushLive(); else liveGuard(); }, function (err) {
      if (err && err.code === 'permission-denied') showGate('DENIED', { email: user.email }); else showGate('FBERR', { message: (err && err.message) || '' });
    });
  }, function (e) { showGate('FBERR', { message: (e && e.message) || '' }); });
}
function watchActive() {
  if (!FB_MODE) return;
  S.cards = []; S.comments = []; S.votes = []; reindexVotes(); stash.cards = null; stash.comments = null;
  if (!S.active) { api.unwatchBoard(); S.boardLoading = false; return; }
  S.boardLoading = true;
  api.watchBoard(S.active, function (bid, rows) { if (bid === S.active) { stash.cards = rows; liveGuard(); } },
    function (bid, rows) { if (bid === S.active) { stash.comments = rows; liveGuard(); } },
    function (err) { if (err && err.code === 'permission-denied') showGate('DENIED', { email: S.user ? S.user.email : '' }); });
}
function flushLive() {
  liveDirty = false;
  var changed = false, redo = false;
  if (stash.boards) {
    var rows = stash.boards, first = S.loading; stash.boards = null; changed = true;
    S.boards = rows.map(normBoard).sort(function (a, z) { return a.order - z.order || a.createdAt - z.createdAt; });
    var saved = LS.get('myboard-active'), has = function (id) { return S.boards.some(function (b) { return b.id === id; }); };
    var next = has(S.active) ? S.active : (has(saved) ? saved : (S.boards[0] ? S.boards[0].id : null));
    if (next !== S.active || first) { S.active = next; watchActive(); redo = true; }
    if (first) { S.loading = false; S.gate = ''; $('#app').classList.remove('is-gate'); setSync('saved'); }
  }
  if (stash.cards) {
    S.cards = stash.cards.map(normCard); stash.cards = null; changed = true; S.boardLoading = false;
    S.cards.forEach(function (c) {
      var b = S.boards.filter(function (x) { return x.id === c.boardId; })[0];
      if (b && !b.columns.some(function (col) { return col.id === c.colId; })) c.colId = b.columns[0].id;
      if (!c.link) {                                         // 제목·내용에 들어 있던 영상 주소는 링크 칸으로
        var a = splitVideoLink(c.body), t = splitVideoLink(c.title);
        if (a.link) { c.link = a.link; c.body = a.text; qCard(c); } else if (t.link) { c.link = t.link; c.title = t.text; qCard(c); }
      }
    });
  }

  if (!changed) return;
  var ae = document.activeElement; if (ae && ae.closest && ae.closest('.composer')) ui.focusC = true;
  if (redo) renderAll(); else { renderSide(); renderTop(); renderTags(); renderStage(); }
}
setInterval(function () { if (FB_MODE && liveDirty && !liveBusy()) flushLive(); }, 1200);
document.addEventListener('focusout', function () { setTimeout(function () { if (FB_MODE && liveDirty && !liveBusy()) flushLive(); }, 60); });

function load() {
  if (FB_MODE) { fbStart(); return; }
  S.loading = true; S.loadError = ''; renderStage(); setSync('saving'); $('#sync span').textContent = '불러오는 중…';
  api.load(function (res) {
    if (res && res.error) { showGate(res.error, res); return; }
    applyData(res || {});
    S.loading = false; S.gate = ''; S.gateTried = false; $('#app').classList.remove('is-gate'); setSync('saved'); renderAll();
    if (SHARE) {
      var cb = curBoard(); if (cb) document.title = cb.name;
      if (ROLE_RANK.indexOf(S.share.role) >= 1 && !ME.name && !LS.get('myboard-vasked')) askName();
    }
    startPoll();
  }, function (err) {
    S.loading = false; S.loadError = (err && err.message) ? err.message : '네트워크 상태를 확인하고 다시 시도해 주세요.'; setSync('error'); renderAll();
  });
}
if (SHARE) $('#app').classList.add('is-share');
renderStatic(); renderTop(); load();
})();
